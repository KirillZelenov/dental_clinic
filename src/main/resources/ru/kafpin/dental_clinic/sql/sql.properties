patient.find_all = SELECT * FROM patients ORDER BY patient_id
patient.find_by_id = SELECT * FROM patients WHERE patient_id = ?
patient.insert = INSERT INTO patients (full_name, birth_date, phone, email, insurance_policy, allergies, contraindications) VALUES (?, ?, ?, ?, ?, ?, ?)
patient.update = UPDATE patients SET full_name = ?, birth_date = ?, phone = ?, email = ?, insurance_policy = ?, allergies = ?, contraindications = ? WHERE patient_id = ?
patient.delete = DELETE FROM patients WHERE patient_id = ?
patient.search = SELECT * FROM patients WHERE full_name ILIKE ? OR phone ILIKE ? OR insurance_policy ILIKE ?

doctor.find_all = SELECT * FROM doctors ORDER BY doctor_id
doctor.find_by_id = SELECT * FROM doctors WHERE doctor_id = ?
doctor.insert = INSERT INTO doctors (full_name, specialization, work_schedule) VALUES (?, ?, ?)
doctor.update = UPDATE doctors SET full_name = ?, specialization = ?, work_schedule = ? WHERE doctor_id = ?
doctor.delete = DELETE FROM doctors WHERE doctor_id = ?
doctor.find_all_names = SELECT full_name FROM doctors ORDER BY full_name

service.find_all = SELECT * FROM services ORDER BY service_id
service.find_by_id = SELECT * FROM services WHERE service_id = ?
service.insert = INSERT INTO services (service_name, cost, avg_duration_minutes) VALUES (?, ?, ?)
service.update = UPDATE services SET service_name = ?, cost = ?, avg_duration_minutes = ? WHERE service_id = ?
service.delete = DELETE FROM services WHERE service_id = ?

appointment.find_all = SELECT * FROM appointments ORDER BY appointment_id
appointment.find_by_id = SELECT * FROM appointments WHERE appointment_id = ?
appointment.insert = INSERT INTO appointments (patient_id, doctor_id, service_id, appointment_date, appointment_time, status, reminder_sent) VALUES (?, ?, ?, ?, ?, ?, ?)
appointment.update = UPDATE appointments SET patient_id = ?, doctor_id = ?, service_id = ?, appointment_date = ?, appointment_time = ?, status = ?, reminder_sent = ? WHERE appointment_id = ?
appointment.delete = DELETE FROM appointments WHERE appointment_id = ?
appointment.find_busy_slots = SELECT a.appointment_time, s.avg_duration_minutes FROM appointments a JOIN services s ON a.service_id = s.service_id WHERE a.doctor_id = ? AND a.appointment_date = ? AND a.status != 'Cancelled' ORDER BY a.appointment_time
appointment.check_availability = SELECT COUNT(*) FROM appointments a JOIN services s ON a.service_id = s.service_id WHERE a.doctor_id = ? AND a.appointment_date = ? AND a.status != 'Cancelled' AND ((a.appointment_time < ? AND (a.appointment_time + (s.avg_duration_minutes || ' minutes')::interval) > ?) OR (a.appointment_time >= ? AND a.appointment_time < ?))
appointment.update_status = UPDATE appointments SET status = ?, updated_at = CURRENT_TIMESTAMP WHERE appointment_id = ?
appointment.update_reminder = UPDATE appointments SET reminder_sent = true, updated_at = CURRENT_TIMESTAMP WHERE appointment_id = ?
appointment.get_schedule = SELECT a.appointment_id, a.appointment_time, a.status, a.reminder_sent, a.patient_id, d.full_name as doctor_name, p.full_name as patient_name, s.service_name, s.avg_duration_minutes FROM appointments a JOIN doctors d ON a.doctor_id = d.doctor_id JOIN patients p ON a.patient_id = p.patient_id JOIN services s ON a.service_id = s.service_id WHERE a.appointment_date = ?

payment.find_all = SELECT * FROM payments ORDER BY payment_id
payment.find_by_id = SELECT * FROM payments WHERE payment_id = ?
payment.insert = INSERT INTO payments (appointment_id, amount, payment_date, payment_status) VALUES (?, ?, ?, ?)
payment.update = UPDATE payments SET amount = ?, payment_date = ?, payment_status = ? WHERE payment_id = ?
payment.delete = DELETE FROM payments WHERE payment_id = ?
payment.find_unpaid = SELECT a.appointment_id, p.full_name as patient_name, s.cost as amount, COALESCE(pay.payment_status, '\u041D\u0435 \u043E\u043F\u043B\u0430\u0447\u0435\u043D') as payment_status FROM appointments a JOIN patients p ON a.patient_id = p.patient_id JOIN services s ON a.service_id = s.service_id LEFT JOIN payments pay ON a.appointment_id = pay.appointment_id WHERE a.status != '\u041E\u0442\u043C\u0435\u043D\u0451\u043D' ORDER BY a.appointment_id
payment.patient_debt = SELECT COALESCE(SUM(s.cost), 0) as total_debt FROM appointments a JOIN services s ON a.service_id = s.service_id LEFT JOIN payments p ON a.appointment_id = p.appointment_id WHERE a.patient_id = ? AND a.status != '\u041E\u0442\u043C\u0435\u043D\u0451\u043D' AND (p.payment_status IS NULL OR p.payment_status != '\u041E\u043F\u043B\u0430\u0447\u0435\u043D')

treatment.find_all = SELECT * FROM treatment_records ORDER BY treatment_id
treatment.find_by_id = SELECT * FROM treatment_records WHERE treatment_id = ?
treatment.insert = INSERT INTO treatment_records (appointment_id, tooth_status, performed_work, prescriptions) VALUES (?, ?, ?, ?)
treatment.update = UPDATE treatment_records SET tooth_status = ?, performed_work = ?, prescriptions = ? WHERE treatment_id = ?
treatment.delete = DELETE FROM treatment_records WHERE treatment_id = ?
treatment.find_by_patient = SELECT tr.* FROM treatment_records tr JOIN appointments a ON tr.appointment_id = a.appointment_id WHERE a.patient_id = ? ORDER BY a.appointment_date DESC, a.appointment_time DESC
treatment.find_by_appointment = SELECT * FROM treatment_records WHERE appointment_id = ?

report.patient_count = SELECT COUNT(DISTINCT patient_id) as count FROM appointments WHERE appointment_date BETWEEN ? AND ?
report.revenue_by_doctor = SELECT d.full_name, COALESCE(SUM(s.cost), 0) as revenue FROM appointments a JOIN doctors d ON a.doctor_id = d.doctor_id JOIN services s ON a.service_id = s.service_id WHERE a.appointment_date BETWEEN ? AND ? AND a.status = '\u0417\u0430\u0432\u0435\u0440\u0448\u0451\u043D' GROUP BY d.doctor_id, d.full_name ORDER BY revenue DESC
report.revenue_by_service = SELECT s.service_name, COUNT(*) as count, COALESCE(SUM(s.cost), 0) as revenue FROM appointments a JOIN services s ON a.service_id = s.service_id WHERE a.appointment_date BETWEEN ? AND ? AND a.status = '\u0417\u0430\u0432\u0435\u0440\u0448\u0451\u043D' GROUP BY s.service_id, s.service_name ORDER BY revenue DESC
report.occupancy = SELECT d.full_name, COUNT(*) as total_appointments, SUM(CASE WHEN a.status = '\u0417\u0430\u0432\u0435\u0440\u0448\u0451\u043D' THEN 1 ELSE 0 END) as completed_appointments FROM appointments a RIGHT JOIN doctors d ON a.doctor_id = d.doctor_id AND a.appointment_date BETWEEN ? AND ? GROUP BY d.doctor_id, d.full_name ORDER BY total_appointments DESC